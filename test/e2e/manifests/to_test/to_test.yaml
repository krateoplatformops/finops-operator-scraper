apiVersion: v1
kind: Secret
metadata:
  name: webservice-mock-endpoint
  namespace: finops-test
stringData:
  server-url: http://<host>:<port>
---
apiVersion: finops.krateo.io/v1
kind: DatabaseConfig
metadata:
  name: finops-database-handler
  namespace: finops-test
spec:
  passwordSecretRef:
    key: password
    name: cratedb-system-credentials
    namespace: krateo-system
  username: system
---
apiVersion: finops.krateo.io/v1
kind: ExporterScraperConfig
metadata:
  name: exporterscraperconfig-sample
  namespace: finops-test
spec:
  exporterConfig:
    api: 
      path: /costs/csv
      verb: GET
      endpointRef:
        name: webservice-mock-endpoint
        namespace: krateo-system
    metricType: cost
    pollingInterval: "1m"
    additionalVariables:
      host: WEBSERVICE_API_MOCK_SERVICE_HOST
      port: WEBSERVICE_API_MOCK_SERVICE_PORT
  scraperConfig:
    pollingInterval: "5s"
    tableName: testfocus
    scraperDatabaseConfigRef:
      name: finops-database-handler
      namespace: finops-test